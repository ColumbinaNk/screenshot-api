services:
  api:
    build: .
    container_name: screenshot-api
    ports:
      - "8000:8000"
    shm_size: "1gb"
    volumes:
      - ./cache:/data/cache
      - ./data:/data
    environment:
      - PORT=8000
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT=${RATE_LIMIT:-60}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - BROWSER_TIMEOUT=${BROWSER_TIMEOUT:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
